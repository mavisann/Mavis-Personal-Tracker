<script>
  window.MAVIS_ANALYTICS = { provider: "plausible", domain: "mavisann.github.io", enabled: false };
</script>
<script>
  // Runs before anything else on the page (before app.js loads, before
  // any rendering) so a logged-out visitor is sent to login.html
  // immediately, without a flash of the dashboard or a wasted API call.
  // Uses the same 'mavis_session' localStorage key and { token } shape
  // that login.html writes and supabaseClient.js's authAPI reads.
  (function () {
    var session = null;
    try {
      session = JSON.parse(localStorage.getItem('mavis_session'));
    } catch (e) {
      session = null;
    }
    if (!session || !session.token) {
      window.location.href = 'login.html';
    }
  })();
</script>
</head>
<body>
  <div id="app">
    <main class="app-loading" aria-live="polite">
      <div class="loading-mark" aria-hidden="true">M</div>
      <div class="skeleton skeleton-heading"></div>
      <div class="skeleton-grid" aria-hidden="true">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
      <p>Loading your study workspace…</p>
    </main>
  </div>

  <script src="supabaseClient.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
