<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — Mavis</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">
  <div class="auth-shell">
    <div class="auth-bg auth-bg-one"></div>
    <div class="auth-bg auth-bg-two"></div>

    <div class="auth-card-wrap">
      <div class="auth-visual">
        <div class="visual-badge">M</div>
        <div class="visual-copy">
          <p class="eyebrow">Mavis - StudyHub</p>
          <h2>Stay on top of your goals.</h2>
          <p>Track classes, tasks, time, and progress in one calm, focused workspace.</p>
        </div>
      </div>

      <div class="auth-panel">
        <div class="text-center mb-7">
          <div class="brand-mark">M</div>
          <h1 class="auth-title">Welcome back</h1>
          <p class="auth-subtitle">Sign in to your dashboard</p>
        </div>

        <div class="tab-switch login-active" aria-label="Authentication options">
          <span class="tab-indicator" aria-hidden="true"></span>
          <button id="tab-login" class="tab-btn active" type="button">
            Log In
          </button>
          <button id="tab-signup" class="tab-btn" type="button">
            Sign Up
          </button>
        </div>

        <div id="error-box" class="hidden mb-4 px-4 py-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm"></div>

        <div class="auth-form-stage">
          <form id="login-form" class="auth-form active">
            <div>
              <label for="login-username" class="field-label">Username</label>
              <input
                id="login-username"
                type="text"
                autocomplete="username"
                required
                placeholder="Enter your username"
                class="auth-input"
              />
            </div>
            <div>
              <label for="login-password" class="field-label">Password</label>
              <div class="password-field">
                <input
                  id="login-password"
                  type="password"
                  autocomplete="current-password"
                  required
                  placeholder="Enter your password"
                  class="auth-input password-input"
                />
                <button type="button" class="toggle-password" data-target="login-password" aria-label="Show password">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <button type="submit" class="auth-submit">Sign In</button>
          </form>

          <form id="signup-form" class="auth-form inactive">
            <div>
              <label for="signup-username" class="field-label">Username</label>
              <input
                id="signup-username"
                type="text"
                autocomplete="username"
                required
                placeholder="Choose a username"
                class="auth-input"
              />
            </div>
            <div>
              <label for="signup-password" class="field-label">Password</label>
              <div class="password-field">
                <input
                  id="signup-password"
                  type="password"
                  autocomplete="new-password"
                  required
                  minlength="6"
                  placeholder="Min. 6 characters"
                  class="auth-input password-input"
                />
                <button type="button" class="toggle-password" data-target="signup-password" aria-label="Show password">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <button type="submit" class="auth-submit">Create Account</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="login.js" defer></script>
</body>
</html>
